; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:f407ve]
platform = ststm32
board = black_f407vg
framework = arduino
debug_tool = jlink

; SWD interface
upload_protocol = jlink

build_flags = -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_SCANF -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
lib_deps = 
    https://github.com/stm32duino/STM32FreeRTOS.git
    https://github.com/coryjfowler/MCP_CAN_lib.git
    https://github.com/craigg96/vesc_can_bus_arduino.git
    https://github.com/SolidGeek/VescUart.git